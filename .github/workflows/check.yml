name: check
on: [push, pull_request]
jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: README, figures and site are up to date with data/
        run: python scripts/build.py --check
